<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Visor by Apurva</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="480" rx="28"/></clipPath>
    <radialGradient id="glow" cx="600" cy="560" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#be123c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="0.5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="54" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c4cc"/>
    </linearGradient>
    <radialGradient id="vinyl">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="blurIn" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0">
        <animate attributeName="stdDeviation" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.27;0.75;0.785;1" values="8;8;0;0;8;8"/>
      </feGaussianBlur>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="#0a0a0c"/>
    <rect width="1200" height="480" fill="url(#glow)"/>

    <g fill="#fff" opacity="0.16">
      <rect x="36" y="14" width="14" height="12" rx="4"/>
      <rect x="66" y="15" width="58" height="10" rx="5"/>
      <rect x="136" y="15" width="34" height="10" rx="5"/>
      <rect x="182" y="15" width="34" height="10" rx="5"/>
      <rect x="228" y="15" width="44" height="10" rx="5"/>
      <rect x="1000" y="15" width="18" height="10" rx="5"/>
      <rect x="1030" y="15" width="26" height="10" rx="5"/>
      <rect x="1068" y="15" width="96" height="10" rx="5"/>
    </g>

    <rect fill="#000" stroke="#ffffff" stroke-opacity="0.07" filter="url(#shadow)" x="480" y="-40" width="240" height="84" rx="22">
      <animate attributeName="width" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.21;0.25;0.77;0.83;0.86;1" values="240;240;784;760;760;226;240;240" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.2 1;0.4 0 0.6 1;0 0 1 1"/>
      <animate attributeName="x" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.21;0.25;0.77;0.83;0.86;1" values="480;480;208;220;220;487;480;480" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.2 1;0.4 0 0.6 1;0 0 1 1"/>
      <animate attributeName="height" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.21;0.25;0.77;0.83;0.86;1" values="84;84;258;250;250;80;84;84" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.2 1;0.4 0 0.6 1;0 0 1 1"/>
      <animate attributeName="rx" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.21;0.25;0.77;0.83;0.86;1" values="22;22;40;38;38;20;22;22" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.6 1;0 0 1 1;0.4 0 0.2 1;0.4 0 0.6 1;0 0 1 1"/>
    </rect>

    <g>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.14;0.17;0.845;0.88;1" values="1;1;0;0;1;1"/>
      <g transform="translate(505 22)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
          <circle r="13" fill="url(#vinyl)" stroke="#2a2a2e"/>
          <circle r="5" fill="url(#rose)"/>
          <rect x="1" y="-4" width="3" height="1.6" rx="0.8" fill="#fff"/>
        </g>
      </g>
      <g fill="url(#rose)">
        <rect x="684" y="16" width="3.5" height="12" rx="1.75"><animate attributeName="height" values="12;5;14;7;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="16;23;14;21;16" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="690" y="12" width="3.5" height="16" rx="1.75"><animate attributeName="height" values="16;8;12;18;16" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="12;20;16;10;12" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="696" y="18" width="3.5" height="10" rx="1.75"><animate attributeName="height" values="10;16;6;13;10" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="18;12;22;15;18" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="702" y="14" width="3.5" height="14" rx="1.75"><animate attributeName="height" values="14;7;17;9;14" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="14;21;11;19;14" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <g opacity="0" filter="url(#blurIn)">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.27;0.75;0.785;1" values="0;0;1;1;0;0"/>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.22;0.27;0.75;0.785;1" values="0 -12;0 -12;0 0;0 0;0 -12;0 -12"/>

      <g transform="translate(306 110)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
          <circle r="64" fill="url(#vinyl)"/>
          <g fill="none" stroke="#2c2c31" stroke-width="1">
            <circle r="56"/><circle r="49"/><circle r="42"/><circle r="35"/>
          </g>
          <path d="M0 -60 A60 60 0 0 1 42 -43" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round"/>
          <circle r="23" fill="url(#rose)"/>
          <rect x="4" y="-17" width="9" height="3" rx="1.5" fill="#fff" opacity="0.85"/>
          <circle r="3" fill="#0a0a0c"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.27;0.33;0.73;0.76;1" values="-30 398 46;-30 398 46;0 398 46;0 398 46;-30 398 46;-30 398 46" keySplines="0 0 1 1;0.3 0 0.2 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"/>
        <path d="M398 46 L386 104 L366 128" fill="none" stroke="#d4d4d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="358" y="122" width="14" height="10" rx="3" fill="#e4e4e7" transform="rotate(-40 365 127)"/>
        <circle cx="398" cy="46" r="8" fill="#3f3f46" stroke="#71717a" stroke-width="2"/>
      </g>

      <text x="432" y="82" fill="#fff" font-size="28" font-weight="700">Visor</text>
      <text x="432" y="110" fill="#a1a1aa" font-size="19" font-weight="500">Apurva Mukherjee</text>
      <rect x="432" y="126" width="300" height="6" rx="3" fill="#27272a"/>
      <rect x="432" y="126" width="70" height="6" rx="3" fill="url(#pill)">
        <animate attributeName="width" dur="8s" repeatCount="indefinite" keyTimes="0;0.26;0.76;1" values="70;70;230;230"/>
      </rect>
      <text x="432" y="152" fill="#71717a" font-size="13" font-weight="500">1:04</text>
      <text x="732" y="152" fill="#71717a" font-size="13" font-weight="500" text-anchor="end">3:31</text>
      <g fill="#fff">
        <path d="M548 170 L536 178 L548 186 Z M536 170 L524 178 L536 186 Z"/>
        <rect x="574" y="168" width="6" height="20" rx="2"/>
        <rect x="586" y="168" width="6" height="20" rx="2"/>
        <path d="M618 170 L630 178 L618 186 Z M630 170 L642 178 L630 186 Z"/>
      </g>

      <g fill="url(#bars)">
        <rect x="790" y="110" width="12" height="40" rx="6"><animate attributeName="height" values="40;86;30;70;40" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="110;64;120;80;110" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="812" y="80" width="12" height="70" rx="6"><animate attributeName="height" values="70;34;92;50;70" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="80;116;58;100;80" dur="0.95s" repeatCount="indefinite"/></rect>
        <rect x="834" y="60" width="12" height="90" rx="6"><animate attributeName="height" values="90;48;76;28;90" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="60;102;74;122;60" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="856" y="100" width="12" height="50" rx="6"><animate attributeName="height" values="50;96;40;80;50" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="100;54;110;70;100" dur="0.85s" repeatCount="indefinite"/></rect>
        <rect x="878" y="90" width="12" height="60" rx="6"><animate attributeName="height" values="60;30;84;44;60" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="90;120;66;106;90" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="900" y="116" width="12" height="34" rx="6"><animate attributeName="height" values="34;70;24;58;34" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="116;80;126;92;116" dur="1s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <text x="600" y="372" text-anchor="middle" fill="url(#title)" font-size="104" font-weight="800" letter-spacing="-3">Visor</text>
    <text x="600" y="420" text-anchor="middle" fill="#a1a1aa" font-size="24" font-weight="500">The MacBook notch, turned into a Dynamic Island.</text>

  </g>
</svg>
