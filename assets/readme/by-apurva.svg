<svg xmlns="http://www.w3.org/2000/svg" width="248" height="48" viewBox="0 0 248 48" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>By Apurva</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="0.55" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="248" height="48" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="248" height="48" fill="#111113"/>
    <rect x="92" width="156" height="48" fill="url(#g)"/>
    <rect x="-60" width="48" height="48" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-60;-60;330" keyTimes="0;0.4;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(28 24)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      <circle r="13" fill="#fafafa"/>
      <circle r="9" fill="none" stroke="#d4d4d8" stroke-width="1"/>
      <circle r="5" fill="#e11d48"/>
      <rect x="-1.2" y="-11" width="2.4" height="4" rx="1.2" fill="#e11d48"/>
      <circle r="1.6" fill="#111113"/>
    </g>
  </g>
  <text x="52" y="30.5" fill="#fafafa" font-size="16" font-weight="800" letter-spacing="2.5">BY</text>
  <text x="170" y="31" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" letter-spacing="3">APURVA</text>
</svg>
