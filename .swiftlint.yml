excluded:
  - .build
  - build
  - dist
  - Visor.xcodeproj
  # Local archive of reference checkouts and 2.x material.
  - backup
  # Ported verbatim from  (2026-09-24); reformatting or
  # linting it to Visor's style would defeat copying it.
  - Visor

opt_in_rules:
  - force_unwrapping

line_length: 120
force_unwrapping: error
force_try: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^\w.])print\('
    match_kinds:
      - identifier
    message: "Use Log (os.Logger) instead of print()."
    severity: error
