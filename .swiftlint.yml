excluded:
  - .build
  - build
  - dist
  - Visor.xcodeproj
  # Reference checkouts, not Visor's source. Kept for porting from, so
  # their style is theirs, not ours.
  - old-code
  - DynamicNotch
  # Ported verbatim from the GPL-3.0 reference so behaviour matches it
  # exactly. Reformatting them to Visor's house style would defeat the
  # point of copying them, and re-porting a fix upstream would conflict.
  - Visor/UI/Player

opt_in_rules:
  - force_unwrapping

line_length: 120
force_unwrapping: error
force_try: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^\w.])print\('
    match_kinds:
      - identifier
    message: "Use Log (os.Logger) instead of print()."
    severity: error
