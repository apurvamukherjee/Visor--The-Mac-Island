excluded:
  - .build
  - build
  - dist
  - Visor.xcodeproj
  # Read-only GPL-3.0 reference checkout. Not ours, not shipped, not linted.
  - DynamicNotch

opt_in_rules:
  - force_unwrapping

line_length: 120
force_unwrapping: error
force_try: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^\w.])print\('
    match_kinds:
      - identifier
    message: "Use Log (os.Logger) instead of print()."
    severity: error
