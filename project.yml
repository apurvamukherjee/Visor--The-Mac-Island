name: Visor
options:
  bundleIdPrefix: com.apurvamukherjee
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
targets:
  Visor:
    type: application
    platform: macOS
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
      # Codex keeps its usage in SQLite; this is the system library, not a
      # third-party package.
      - sdk: libsqlite3.tbd
    sources:
      - path: Visor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.visor
        CODE_SIGN_ENTITLEMENTS: Visor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "2.9.0"
        CURRENT_PROJECT_VERSION: "31"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signing gives the app a new identity on every build, so TCC
        # re-asks for calendar access each time. A stable identity fixes it.
        # Add your Apple ID in Xcode > Settings > Accounts (free is enough),
        # then fill in DEVELOPMENT_TEAM below with the 10-character Team ID
        # from that screen and uncomment both lines.
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Apurva Mukherjee"
        NSCalendarsFullAccessUsageDescription: "Visor shows your upcoming events in the notch."
  VisorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VisorTests
    dependencies:
      - target: Visor
      - package: MediaRemoteAdapter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Visor:
    build:
      targets:
        Visor: all
        VisorTests: [test]
    test:
      targets:
        - VisorTests
    run:
      config: Debug
