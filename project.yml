name: Notchy
options:
  bundleIdPrefix: com.apurvamukherjee
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
targets:
  Notchy:
    type: application
    platform: macOS
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
    sources:
      - path: Notchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.notchy
        CODE_SIGN_ENTITLEMENTS: Notchy.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ad-hoc signing gives the app a new identity on every build, so TCC
        # re-asks for calendar access each time. A stable identity fixes it.
        # Add your Apple ID in Xcode > Settings > Accounts (free is enough),
        # then fill in DEVELOPMENT_TEAM below with the 10-character Team ID
        # from that screen and uncomment both lines.
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Apurva Mukherjee"
        NSCalendarsFullAccessUsageDescription: "Notchy shows your upcoming events in the notch."
  NotchyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchyTests
    dependencies:
      - target: Notchy
      - package: MediaRemoteAdapter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Notchy:
    build:
      targets:
        Notchy: all
        NotchyTests: [test]
    test:
      targets:
        - NotchyTests
    run:
      config: Debug
