name: Notchy
options:
  bundleIdPrefix: com.apurvamukherjee
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Notchy:
    type: application
    platform: macOS
    sources:
      - path: Notchy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.notchy
        CODE_SIGN_ENTITLEMENTS: Notchy.entitlements
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Apurva Mukherjee"
  NotchyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchyTests
    dependencies:
      - target: Notchy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Notchy:
    build:
      targets:
        Notchy: all
        NotchyTests: [test]
    test:
      targets:
        - NotchyTests
    run:
      config: Debug
