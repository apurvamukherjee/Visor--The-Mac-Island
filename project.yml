name: Visor
options:
  bundleIdPrefix: com.apurvamukherjee
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # The app is ported verbatim and written for Swift 5; strict Swift 6
    # concurrency would mean editing dozens of copied files.
    SWIFT_VERSION: "5.0"
    # Apple silicon only, so an x86_64 slice is dead weight.
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
  configs:
    # `xcodebuild build` skips STRIP_INSTALLED_PRODUCT unless this is on, so
    # Release shipped its full symbol table.
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
# Pinned to the exact versions the ported code was built against.
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
  AsyncXPCConnection:
    url: https://github.com/ChimeHQ/AsyncXPCConnection
    exactVersion: 1.3.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: 9.0.6
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    exactVersion: 1.1.0
  MacroVisionKit:
    url: https://github.com/TheBoredTeam/MacroVisionKit
    exactVersion: 0.2.0
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    exactVersion: 1.0.0
targets:
  Visor:
    type: application
    platform: macOS
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
      # Embedded under Contents/XPCServices; XPCHelperClient connects to it
      # by this target's bundle ID.
      - target: VisorXPCHelper
      - package: AsyncXPCConnection
      - package: Defaults
      - package: KeyboardShortcuts
      - package: LaunchAtLogin
      - package: MacroVisionKit
      - package: SkyLightWindow
    sources:
      - path: Visor
      # One protocol file, compiled into both the app and the helper.
      - path: VisorXPCHelper/XPCHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.visor
        PRODUCT_NAME: Visor
        CODE_SIGN_ENTITLEMENTS: Visor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "3.1.1"
        CURRENT_PROJECT_VERSION: "36"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"Visor/Preview Content\""
        SWIFT_EMIT_LOC_STRINGS: YES
        # Ad-hoc signing gives the app a new identity on every build, so TCC
        # re-asks for calendar access each time. A stable identity fixes it.
        # Add your Apple ID in Xcode > Settings > Accounts (free is enough),
        # then fill in DEVELOPMENT_TEAM below with the 10-character Team ID
        # from that screen and uncomment both lines.
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Visor
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Apurva Mukherjee"
        NSAppleEventsUsageDescription: "Visor uses AppleEvents to control music."
        NSCalendarsFullAccessUsageDescription: "Visor uses the calendar to display your calendar events."
        NSRemindersFullAccessUsageDescription: "Visor uses Reminders to display your scheduled reminders in the calendar."
        NSCameraUsageDescription: "Visor uses the camera to display a live camera view."
        # The YouTube Music controller talks to a local HTTP server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Ported verbatim from 's XPCHelper. Unsandboxed,
  # it runs the Accessibility checks and the screen/keyboard brightness
  # calls for the app.
  VisorXPCHelper:
    type: xpc-service
    platform: macOS
    sources:
      - path: VisorXPCHelper
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.visor.VisorXPCHelper
        PRODUCT_NAME: VisorXPCHelper
        INFOPLIST_FILE: VisorXPCHelper/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VisorXPCHelper
        CODE_SIGN_ENTITLEMENTS: VisorXPCHelper/XPCHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "3.1.1"
        CURRENT_PROJECT_VERSION: "36"
schemes:
  Visor:
    build:
      targets:
        Visor: all
    run:
      config: Debug
