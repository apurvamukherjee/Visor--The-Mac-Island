name: Visor
options:
  bundleIdPrefix: com.apurvamukherjee
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # The app is ported verbatim and written for Swift 5; strict Swift 6
    # concurrency would mean editing dozens of copied files.
    SWIFT_VERSION: "5.0"
    # Apple silicon only, so an x86_64 slice is dead weight.
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
  configs:
    # `xcodebuild build` skips STRIP_INSTALLED_PRODUCT unless this is on, so
    # Release shipped its full symbol table.
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
# Pinned to the exact versions the ported code was built against.
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    exactVersion: 9.0.6
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
targets:
  Visor:
    type: application
    platform: macOS
    dependencies:
      - package: MediaRemoteAdapter
        embed: true
      - package: Defaults
      - package: KeyboardShortcuts
    sources:
      - path: Visor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apurvamukherjee.visor
        PRODUCT_NAME: Visor
        CODE_SIGN_ENTITLEMENTS: Visor.entitlements
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "3.1.2"
        CURRENT_PROJECT_VERSION: "37"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        # Ad-hoc signing gives the app a new identity on every build, so TCC
        # re-asks for calendar access each time. A stable identity fixes it.
        # Add your Apple ID in Xcode > Settings > Accounts (free is enough),
        # then fill in DEVELOPMENT_TEAM below with the 10-character Team ID
        # from that screen and uncomment both lines.
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # CODE_SIGN_IDENTITY: "Apple Development"
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Visor
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Apurva Mukherjee"
        NSAppleEventsUsageDescription: "Visor uses AppleEvents to control music."
        NSCalendarsFullAccessUsageDescription: "Visor uses the calendar to display your calendar events."
        NSRemindersFullAccessUsageDescription: "Visor uses Reminders to display your scheduled reminders in the calendar."
        NSCameraUsageDescription: "Visor uses the camera to display a live camera view."
        # The YouTube Music controller talks to a local HTTP server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
schemes:
  Visor:
    build:
      targets:
        Visor: all
    run:
      config: Debug
